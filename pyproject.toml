[project]
name = "fuelroute"
version = "0.1.0"
description = "Fast, optimal fuel stop route planner for cross-country USA trips"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.1,<6.2",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "httpx>=0.27.0",
    "gunicorn>=23.0.0",
    "whitenoise>=6.7.0",
    "orjson>=3.10.0",
    "rapidfuzz>=3.9.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "hypothesis>=6.100.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "config*"]
exclude = ["data*", "docs*", "tests*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "docs",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # Line length handled by formatter
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
